name: DirectorCut CI

on:
  push:
  pull_request:

concurrency:
  group: directorcut-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native, media, GStreamer and GES dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev ffmpeg pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libges-1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
      - name: Configure
        run: cmake -S . -B build -DDIRECTORCUT_BUILD_QT_UI=OFF -DDIRECTORCUT_BUILD_GSTREAMER=ON
      - name: Build
        run: cmake --build build -j2
      - name: Verify native Program Monitor target
        run: test -x build/directorcut_program_monitor
      - name: Headless GES full-timeline playback and Inspector smoke test
        run: |
          set -o pipefail
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc=size=320x240:rate=24 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 1 -c:v libtheora -c:a libvorbis /tmp/directorcut-monitor.ogv
          node <<'NODE'
          const fs = require('fs');
          const { buildTimelineManifest } = require('./desktop/timeline-manifest');
          const source = '/tmp/directorcut-monitor.ogv';
          const project = { media:{width:320,height:240,frameRate:24}, timeline:{ fps:24, tracks:[
            {id:'C1',kind:'caption',clips:[{id:'caption-1',name:'Native caption',start:.08,duration:.45,text:{content:'Native caption',style:{fontFamily:'Sans',fontSize:28},position:{x:.5,y:.82}}}]},
            {id:'V1',kind:'video',clips:[{id:'v1',sourcePath:source,start:0,sourceIn:0,duration:0.64,keyframes:{x:[{time:0,value:0},{time:.32,value:12}],scale:[{time:0,value:1},{time:.32,value:.9}],opacity:[{time:0,value:1},{time:.32,value:.8}],rotation:[{time:0,value:0},{time:.32,value:5}],speed:[{time:0,value:1.25}]},effects:[
              {id:'color',type:'color',enabled:true,params:{exposure:.5,contrast:1.1,saturation:1.2,temperature:15,tint:-8,highlights:20,shadows:-15}},
              {id:'blur',type:'blur',enabled:true,params:{radius:2}},
              {id:'sharpen',type:'sharpen',enabled:true,params:{amount:.3}},
              {id:'vignette',type:'vignette',enabled:true,params:{amount:.2}},
              {id:'motion-blur',type:'motionBlur',enabled:true,params:{amount:.25}}
            ]}]},
            {id:'A1',kind:'audio',clips:[{id:'a1',sourcePath:source,start:0,sourceIn:0,duration:0.64,keyframes:{volume:[{time:0,value:1},{time:.32,value:.7}],speed:[{time:0,value:1.25}]}}]}
          ]}};
          const manifest=buildTimelineManifest(project);
          if(!manifest.text.startsWith('DIRECTORCUT_TIMELINE_V6\n')) throw new Error('native manifest is not V6');
          if(manifest.titleClips!==1) throw new Error('caption was not serialized into V6 manifest');
          fs.writeFileSync('/tmp/directorcut-monitor.timeline', manifest.text);
          NODE
          printf 'DURATION\nSEEK\t100000000\nSET\tv1\topacity\t0.6\nSET\tv1\tx\t18\nSET\tv1\tscale\t0.85\nSET\tv1\trotation\t7\nSET\ta1\tvolume\t0.5\nSET\tv1\teffect.color.exposure\t0.8\nSET\tv1\teffect.color.contrast\t1.2\nSET\tv1\teffect.color.saturation\t1.3\nSET\tv1\teffect.color.temperature\t25\nSET\tv1\teffect.color.tint\t-12\nSET\tv1\teffect.color.highlights\t35\nSET\tv1\teffect.color.shadows\t-22\nSET\tv1\teffect.blur.radius\t3\nPLAY\nPAUSE\nQUIT\n' | build/directorcut_program_monitor --headless --manifest /tmp/directorcut-monitor.timeline 2>&1 | tee /tmp/directorcut-monitor.out
          grep -q '^READY' /tmp/directorcut-monitor.out
          grep -q $'^OK\tSEEK' /tmp/directorcut-monitor.out
          test "$(grep -c $'^OK\tSET' /tmp/directorcut-monitor.out)" -eq 13
          grep -q $'^OK\tPLAY' /tmp/directorcut-monitor.out
          grep -q $'^OK\tPAUSE' /tmp/directorcut-monitor.out
          ! grep -qi 'rate.*not writable' /tmp/directorcut-monitor.out
      - name: Test native core and GStreamer backend
        run: ctest --test-dir build --output-on-failure
      - name: Syntax desktop host Program Monitor footage intelligence and recording store
        run: node --check desktop/main-v04.js && node --check desktop/main.js && node --check desktop/preload.js && node --check desktop/home-history.js && node --check desktop/native-program-monitor.js && node --check desktop/native-monitor-ipc.js && node --check desktop/timeline-manifest.js && node --check desktop/footage-intelligence.js && node --check desktop/recording-store.js
      - name: Syntax media local AI and Stage 5 renderer
        run: node --check desktop/media-utils.js && node --check desktop/timeline-renderer.js && node --check desktop/timeline-renderer-stage4.js && node --check desktop/ollama-client.js && node --check desktop/gstreamer.js
      - name: Syntax timeline Inspector caption Stage 6 and Recording Director UI
        run: node --check prototype/timeline-engine.js && node --check prototype/caption-editor-utils.js && node --check prototype/caption-utils.js && node --check prototype/caption-inspector.js && node --check prototype/selection-actions.js && node --check prototype/preview-gap-utils.js && node --check prototype/media-library-utils.js && node --check prototype/media-library-runtime.js && node --check prototype/footage-intelligence-utils.js && node --check prototype/footage-intelligence-runtime.js && node --check prototype/recording-director-utils.js && node --check prototype/recording-assembly-utils.js && node --check prototype/recording-director.js && node --check prototype/edit-undo-utils.js && node --check prototype/professional-timeline-utils.js && node --check prototype/professional-timeline-runtime.js && node --check prototype/professional-inspector-utils.js && node --check prototype/audio-post-utils.js && node --check prototype/advanced-inspector-utils.js && node --check prototype/effects-color-utils.js && node --check prototype/transitions-utils.js && node --check prototype/professional-inspector.js && node --check prototype/advanced-inspector.js && node --check prototype/native-inspector-live.js && node --check prototype/effects-color-runtime.js && node --check prototype/transitions-runtime.js && node --check prototype/app.js && node --check prototype/interaction-controller.js
      - name: Syntax advanced timeline and professional workflow
        run: node --check prototype/stage4-controller.js && node --check prototype/stage5-timeline-ui.js && node --check prototype/ux-controller.js && node --check prototype/pro-workflow.js && node --check prototype/selection-workflow.js && node --check prototype/program-monitor.js && node --check prototype/capcut-workflow.js && node --check prototype/playback-gap-guard.js && node --check prototype/composer-runtime.js && node --check prototype/edit-undo-runtime.js && node --check prototype/home-dashboard.js
      - name: Test media utilities
        run: node desktop/tests/media-utils.test.js
      - name: Test Stage 6 footage intelligence model
        run: node desktop/tests/footage-intelligence-utils.test.js
      - name: Analyze real Stage 6 synthetic footage
        run: node desktop/tests/footage-intelligence.test.js
      - name: Test Stage 7 recording session workflow
        run: node desktop/tests/recording-director-utils.test.js
      - name: Test Stage 7 script take alignment and assembly
        run: node desktop/tests/recording-assembly-utils.test.js
      - name: Reconstruct real Stage 7 streamed recording
        run: node desktop/tests/recording-store.test.js
      - name: Test timeline engine
        run: node desktop/tests/timeline-engine.test.js
      - name: Test selected clip actions
        run: node desktop/tests/selection-actions.test.js
      - name: Test caption timeline utilities
        run: node desktop/tests/caption-utils.test.js
      - name: Test Stage 4 caption editing and SRT model
        run: node desktop/tests/caption-editor-utils.test.js
      - name: Test source preview gap detection
        run: node desktop/tests/preview-gap-utils.test.js
      - name: Test multi-source media library
        run: node desktop/tests/media-library-utils.test.js
      - name: Test edit undo conversation preservation
        run: node desktop/tests/edit-undo-utils.test.js
      - name: Test professional timeline completion
        run: node desktop/tests/professional-timeline-utils.test.js
      - name: Test professional inspector properties
        run: node desktop/tests/professional-inspector-utils.test.js
      - name: Test Stage 3 advanced inspector properties
        run: node desktop/tests/advanced-inspector-utils.test.js
      - name: Test professional audio processing
        run: node desktop/tests/audio-post-utils.test.js
      - name: Test Stage 5 color and effects model
        run: node desktop/tests/effects-color-utils.test.js
      - name: Test transitions and extensible clip data
        run: node desktop/tests/transitions-utils.test.js
      - name: Test native timeline V6 caption graphic and Stage 5 manifest
        run: node desktop/tests/timeline-manifest.test.js
      - name: Render real Stage 3 multitrack and transition smoke test
        run: node desktop/tests/timeline-renderer.test.js
      - name: Render real Stage 5 highlights LUT and motion blur smoke test
        run: node desktop/tests/effects-renderer-stage5.test.js
      - name: Render real Stage 4 caption burn-in smoke test
        run: node desktop/tests/caption-renderer-stage4.test.js
      - name: Check local transcription adapter
        run: python3 -m py_compile scripts/transcribe_local.py