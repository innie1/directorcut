name: DirectorCut CI

on:
  push:
  pull_request:

concurrency:
  group: directorcut-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native, media, GStreamer and GES dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev ffmpeg pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libges-1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - name: Configure
        run: cmake -S . -B build -DDIRECTORCUT_BUILD_QT_UI=OFF -DDIRECTORCUT_BUILD_GSTREAMER=ON
      - name: Build
        run: cmake --build build -j2
      - name: Verify native Program Monitor target
        run: test -x build/directorcut_program_monitor
      - name: Headless GES timeline playback smoke test
        run: |
          set -o pipefail
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc=size=320x240:rate=24 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 1 -c:v libtheora -c:a libvorbis /tmp/directorcut-monitor.ogv
          node <<'NODE'
          const fs = require('fs');
          const { buildTimelineManifest } = require('./desktop/timeline-manifest');
          const source = '/tmp/directorcut-monitor.ogv';
          const project = { timeline:{ fps:24, tracks:[
            {id:'V1',kind:'video',clips:[{id:'v1',sourcePath:source,start:0,sourceIn:0,duration:0.8}]},
            {id:'A1',kind:'audio',clips:[{id:'a1',sourcePath:source,start:0,sourceIn:0,duration:0.8}]}
          ]}};
          fs.writeFileSync('/tmp/directorcut-monitor.timeline', buildTimelineManifest(project).text);
          NODE
          printf 'DURATION\nSEEK\t100000000\nPLAY\nPAUSE\nQUIT\n' | build/directorcut_program_monitor --headless --manifest /tmp/directorcut-monitor.timeline 2>&1 | tee /tmp/directorcut-monitor.out
          grep -q '^READY' /tmp/directorcut-monitor.out
          grep -q $'^OK\tSEEK' /tmp/directorcut-monitor.out
          grep -q $'^OK\tPLAY' /tmp/directorcut-monitor.out
          grep -q $'^OK\tPAUSE' /tmp/directorcut-monitor.out
      - name: Test native core and GStreamer backend
        run: ctest --test-dir build --output-on-failure
      - name: Syntax desktop host and Program Monitor bridge
        run: node --check desktop/main-v04.js && node --check desktop/main.js && node --check desktop/preload.js && node --check desktop/native-program-monitor.js && node --check desktop/native-monitor-ipc.js && node --check desktop/timeline-manifest.js
      - name: Syntax media and local AI
        run: node --check desktop/media-utils.js && node --check desktop/timeline-renderer.js && node --check desktop/ollama-client.js && node --check desktop/gstreamer.js
      - name: Syntax timeline engine and base UI
        run: node --check prototype/timeline-engine.js && node --check prototype/caption-utils.js && node --check prototype/selection-actions.js && node --check prototype/preview-gap-utils.js && node --check prototype/media-library-utils.js && node --check prototype/media-library-runtime.js && node --check prototype/edit-undo-utils.js && node --check prototype/app.js && node --check prototype/interaction-controller.js
      - name: Syntax advanced timeline and professional workflow
        run: node --check prototype/stage4-controller.js && node --check prototype/stage5-timeline-ui.js && node --check prototype/ux-controller.js && node --check prototype/pro-workflow.js && node --check prototype/selection-workflow.js && node --check prototype/program-monitor.js && node --check prototype/capcut-workflow.js && node --check prototype/playback-gap-guard.js && node --check prototype/composer-runtime.js && node --check prototype/edit-undo-runtime.js
      - name: Test media utilities
        run: node desktop/tests/media-utils.test.js
      - name: Test timeline engine
        run: node desktop/tests/timeline-engine.test.js
      - name: Test selected clip actions
        run: node desktop/tests/selection-actions.test.js
      - name: Test caption timeline utilities
        run: node desktop/tests/caption-utils.test.js
      - name: Test source preview gap detection
        run: node desktop/tests/preview-gap-utils.test.js
      - name: Test multi-source media library
        run: node desktop/tests/media-library-utils.test.js
      - name: Test edit undo conversation preservation
        run: node desktop/tests/edit-undo-utils.test.js
      - name: Test native timeline manifest
        run: node desktop/tests/timeline-manifest.test.js
      - name: Render real multitrack smoke test
        run: node desktop/tests/timeline-renderer.test.js
      - name: Check local transcription adapter
        run: python3 -m py_compile scripts/transcribe_local.py
